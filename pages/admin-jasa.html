<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Jasa - MarketFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
  </head>
  <body data-admin-page="services">
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="dashboard-admin.html">Market<span class="brand-dot">Flow</span> Admin</a>
        <button class="btn btn-success" id="logout-button">Logout</button>
      </div>
    </nav>
    <main class="container section-pad">
      <div id="alert-area"></div>
      <div class="row g-4">
        <aside class="col-lg-3">
          <div class="admin-sidebar">
            <a class="admin-link" href="dashboard-admin.html">Dashboard</a>
            <a class="admin-link" href="admin-produk.html">Produk</a>
            <a class="admin-link active" href="admin-jasa.html">Jasa</a>
            <a class="admin-link" href="admin-sewa.html">Sewa</a>
            <a class="admin-link" href="admin-order.html">Order Masuk</a>
          </div>
        </aside>
        <section class="col-lg-9">
          <h1 class="fw-bold">Jasa</h1>
          <p class="text-muted">Kelola layanan edit video, desain poster, dan kebutuhan kreatif lain.</p>
          <form id="item-form" class="auth-card mb-4">
            <input type="hidden" id="item-id">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Nama jasa<input class="form-control mt-1" id="name" required></label></div>
              <div class="col-md-6 category-field">
                <label class="form-label">Kategori
                  <input class="form-control mt-1" id="category" list="category-options" placeholder="Editing" required>
                </label>
                <div id="category-suggestions" class="list-group category-suggestions"></div>
                <datalist id="category-options"></datalist>
              </div>
              <div class="col-md-6"><label class="form-label">Harga<input class="form-control mt-1" id="price" type="number" min="0" step="1000" required></label></div>
              <div class="col-md-6"><label class="form-label">Estimasi pengerjaan (hari per jasa)<input class="form-control mt-1" id="estimatedDays" type="number" min="1" step="1" value="1" required></label></div>
              <div class="col-12">
                <div class="form-check mt-1">
                  <input class="form-check-input" type="checkbox" id="isActive" checked>
                  <label class="form-check-label" for="isActive">Tampilkan jasa di katalog user</label>
                </div>
              </div>
              <div class="col-12"><label class="form-label">Deskripsi<textarea class="form-control mt-1" id="description" rows="3" required></textarea></label></div>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-success" type="submit" id="submit-label">Simpan Jasa</button>
              <button class="btn btn-outline-secondary" type="button" id="reset-form">Reset</button>
            </div>
          </form>
          <div id="item-list"></div>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/admin-crud.js"></script>
  </body>
</html>
