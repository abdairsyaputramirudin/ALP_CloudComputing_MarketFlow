<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Masuk - MarketFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="dashboard-admin.html">Market<span class="brand-dot">Flow</span> Admin</a>
        <button class="btn btn-success" id="logout-button">Logout</button>
      </div>
    </nav>
    <main class="container section-pad">
      <div id="alert-area"></div>
      <div class="row g-4">
        <aside class="col-lg-3">
          <div class="admin-sidebar">
            <a class="admin-link" href="dashboard-admin.html">Dashboard</a>
            <a class="admin-link" href="admin-produk.html">Produk</a>
            <a class="admin-link" href="admin-jasa.html">Jasa</a>
            <a class="admin-link" href="admin-sewa.html">Sewa</a>
            <a class="admin-link active" href="admin-order.html">Order Masuk</a>
          </div>
        </aside>
        <section class="col-lg-9 order-admin-page">
          <h1 class="fw-bold order-admin-page__title">Order Masuk</h1>
          <p class="text-muted order-admin-page__subtitle">Admin dapat melihat data buyer, verifikasi pembayaran, update progres order, dan memberi catatan untuk user.</p>
          <div class="d-flex gap-2 flex-wrap mb-3 order-filter-group">
            <button class="btn btn-sm btn-outline-secondary active" data-payment-filter="Semua">Semua</button>
            <button class="btn btn-sm btn-outline-secondary" data-payment-filter="Belum Terverifikasi">Belum Terverifikasi</button>
            <button class="btn btn-sm btn-outline-secondary" data-payment-filter="Menunggu Verifikasi">Menunggu Verifikasi</button>
            <button class="btn btn-sm btn-outline-secondary" data-payment-filter="Lunas">Lunas</button>
          </div>
          <div class="d-flex gap-2 flex-wrap mb-3 order-filter-group">
            <button class="btn btn-sm btn-outline-dark active" data-type-filter="Semua">Semua Tipe</button>
            <button class="btn btn-sm btn-outline-dark" data-type-filter="produk">Produk</button>
            <button class="btn btn-sm btn-outline-dark" data-type-filter="jasa">Jasa</button>
            <button class="btn btn-sm btn-outline-dark" data-type-filter="sewa">Sewa</button>
          </div>
          <div class="d-flex gap-2 flex-wrap mb-3 order-filter-group">
            <button class="btn btn-sm btn-outline-success active" data-completion-filter="Semua">Semua Progress</button>
            <button class="btn btn-sm btn-outline-success" data-completion-filter="Belum Selesai">Belum Selesai</button>
            <button class="btn btn-sm btn-outline-success" data-completion-filter="Selesai">Selesai</button>
          </div>
          <div class="mb-3">
            <input class="form-control" id="order-search" placeholder="Cari nama item, email, nama buyer, atau nomor WA...">
          </div>
          <div id="order-list"></div>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/admin-orders.js"></script>
  </body>
</html>
