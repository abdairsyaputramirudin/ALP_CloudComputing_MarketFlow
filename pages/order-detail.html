<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detail Order - MarketFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="dashboard-user.html">Market<span class="brand-dot">Flow</span></a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-success" href="dashboard-user.html">Dashboard</a>
          <button class="btn btn-success" id="logout-button">Logout</button>
        </div>
      </div>
    </nav>
    <main class="container section-pad">
      <div id="alert-area"></div>
      <div class="row g-4">
        <section class="col-lg-5">
          <article class="feature-card">
            <p class="text-success fw-bold mb-2">Detail Item</p>
            <h1 class="fw-bold h3" id="order-title">Detail Order</h1>
            <div id="item-summary"></div>
            <div class="d-grid mt-3">
              <a class="btn btn-outline-success" id="chat-admin" href="#" target="_blank" rel="noreferrer">Chat Admin</a>
            </div>
          </article>
        </section>
        <section class="col-lg-7">
          <form class="auth-card" id="order-form">
            <h2 class="h5 fw-bold mb-3">Form Order</h2>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="buyer-name">Nama buyer</label>
                <input class="form-control" id="buyer-name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="buyer-whatsapp">Nomor WhatsApp buyer</label>
                <input class="form-control" id="buyer-whatsapp" placeholder="08xxxxxxxxxx / 62xxxxxxxxxx" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="payment-method">Metode pembayaran</label>
                <select class="form-select" id="payment-method">
                  <option value="Transfer Manual">Transfer Manual</option>
                  <option value="QRIS Manual">QRIS Manual</option>
                  <option value="COD">COD</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="proof-link">Link bukti bayar (opsional)</label>
                <input class="form-control" id="proof-link" type="url" placeholder="https://drive.google.com/...">
              </div>
              <div class="col-12">
                <div class="row g-3" id="extra-fields"></div>
              </div>
            </div>
            <div class="d-grid mt-3">
              <button class="btn btn-success" type="submit">Buat Pesanan</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/order-detail.js"></script>
  </body>
</html>
