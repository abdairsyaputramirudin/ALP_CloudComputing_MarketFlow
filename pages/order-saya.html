<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Saya - MarketFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
  </head>
  <body>
    <nav class="navbar bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="dashboard-user.html">Market<span class="brand-dot">Flow</span></a>
        <button class="btn btn-success" id="logout-button">Logout</button>
      </div>
    </nav>
    <main class="container">
      <section class="page-title">
        <p class="text-success fw-bold mb-2">User</p>
        <h1 class="fw-bold">Order Saya</h1>
        <p class="text-muted">Pantau pembayaran, progres order, serta catatan dari admin.</p>
      </section>
      <div id="alert-area"></div>
      <div class="d-flex gap-2 flex-wrap mb-3">
        <button class="btn btn-sm btn-outline-secondary active" data-payment-filter="Semua">Semua</button>
        <button class="btn btn-sm btn-outline-secondary" data-payment-filter="Belum Terverifikasi">Belum Terverifikasi</button>
        <button class="btn btn-sm btn-outline-secondary" data-payment-filter="Menunggu Verifikasi">Menunggu Verifikasi</button>
        <button class="btn btn-sm btn-outline-secondary" data-payment-filter="Lunas">Lunas</button>
      </div>
      <div class="d-flex gap-2 flex-wrap mb-3">
        <button class="btn btn-sm btn-outline-dark active" data-type-filter="Semua">Semua Tipe</button>
        <button class="btn btn-sm btn-outline-dark" data-type-filter="produk">Produk</button>
        <button class="btn btn-sm btn-outline-dark" data-type-filter="jasa">Jasa</button>
        <button class="btn btn-sm btn-outline-dark" data-type-filter="sewa">Sewa</button>
      </div>
      <div id="order-list"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/user-orders.js"></script>
  </body>
</html>
