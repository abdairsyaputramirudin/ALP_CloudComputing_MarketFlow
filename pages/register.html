<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - MarketFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
  </head>
  <body>
    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="../index.html">Market<span class="brand-dot">Flow</span></a>
      </div>
    </nav>
    <main class="auth-shell">
      <section class="auth-card">
        <h1 class="h3 fw-bold mb-2">Register</h1>
        <p class="text-muted">Setelah register, Firebase akan mengirim email verifikasi.</p>
        <div id="alert-area"></div>
        <form id="register-form" class="d-grid gap-3">
          <label class="form-label">Nama
            <input class="form-control mt-1" id="name" type="text" required>
          </label>
          <label class="form-label">Email
            <input class="form-control mt-1" id="email" type="email" required>
          </label>
          <label class="form-label">Password
            <input class="form-control mt-1" id="password" type="password" minlength="6" required>
          </label>
          <button class="btn btn-success" type="submit">Buat Akun</button>
        </form>
        <p class="mt-3 mb-0">Sudah punya akun? <a href="login.html">Login</a></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/auth.js"></script>
  </body>
</html>
